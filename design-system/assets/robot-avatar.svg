<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Robô mecha minimalista">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9fbff"/>
      <stop offset=".4" stop-color="#7fe9f2"/>
      <stop offset=".7" stop-color="#00a1b0"/>
      <stop offset="1" stop-color="#00a1b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3436"/>
      <stop offset=".5" stop-color="#15191a"/>
      <stop offset="1" stop-color="#050606"/>
    </linearGradient>
    <linearGradient id="armorLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4143"/>
      <stop offset="1" stop-color="#0d1011"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f474a"/>
      <stop offset="1" stop-color="#191d1e"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe9f2"/>
      <stop offset="1" stop-color="#00a1b0"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="378" rx="140" ry="12" fill="#000" opacity=".2"/>

  <!-- ===== SHOULDERS / PAULDRONS (clean) ===== -->
  <path d="M26 172 Q22 152 58 150 L106 156 L120 212 L98 292 Q36 296 24 252 Z" fill="url(#armorLight)" stroke="#0b0d0d" stroke-width="3"/>
  <path d="M374 172 Q378 152 342 150 L294 156 L280 212 L302 292 Q364 296 376 252 Z" fill="url(#armorLight)" stroke="#0b0d0d" stroke-width="3"/>
  <!-- single teal accent line per pauldron -->
  <rect x="46" y="230" width="46" height="6" rx="3" fill="#00a1b0"/>
  <rect x="308" y="230" width="46" height="6" rx="3" fill="#00a1b0"/>

  <!-- ===== UPPER ARMS ===== -->
  <rect x="42" y="284" width="60" height="86" rx="24" fill="url(#armor)" stroke="#0b0d0d" stroke-width="3"/>
  <rect x="298" y="284" width="60" height="86" rx="24" fill="url(#armor)" stroke="#0b0d0d" stroke-width="3"/>
  <circle cx="72" cy="348" r="9" fill="#0a0c0d" stroke="#00a1b0" stroke-width="3"/>
  <circle cx="328" cy="348" r="9" fill="#0a0c0d" stroke="#00a1b0" stroke-width="3"/>

  <!-- ===== NECK / COLLAR ===== -->
  <rect x="170" y="122" width="60" height="32" rx="12" fill="url(#steel)"/>
  <rect x="152" y="148" width="96" height="24" rx="12" fill="url(#armorLight)" stroke="#0b0d0d" stroke-width="3"/>

  <!-- ===== TORSO ===== -->
  <path d="M114 170 H286 L298 214 L284 320 Q284 342 260 342 H140 Q116 342 116 320 L102 214 Z"
        fill="url(#armor)" stroke="#0b0d0d" stroke-width="3"/>
  <path d="M134 182 H266 L274 226 H126 Z" fill="url(#armorLight)"/>
  <!-- reactor core -->
  <circle cx="200" cy="250" r="52" fill="url(#core)" opacity=".65"/>
  <circle cx="200" cy="250" r="29" fill="#0a0c0d" stroke="#00a1b0" stroke-width="5"/>
  <circle cx="200" cy="250" r="16" fill="url(#visor)"/>
  <circle cx="200" cy="250" r="6" fill="#eafdff"/>

  <!-- ===== HEAD (helmet + visor) ===== -->
  <rect x="193" y="34" width="14" height="24" rx="6" fill="#1c2122"/>
  <circle cx="200" cy="30" r="7" fill="#00a1b0"/>
  <path d="M138 100 Q138 54 200 54 Q262 54 262 100 L262 116 Q262 144 232 144 H168 Q138 144 138 116 Z"
        fill="url(#armor)" stroke="#0b0d0d" stroke-width="3"/>
  <rect x="122" y="96" width="18" height="38" rx="9" fill="url(#steel)"/>
  <rect x="260" y="96" width="18" height="38" rx="9" fill="url(#steel)"/>
  <circle cx="131" cy="114" r="4.5" fill="#00a1b0"/>
  <circle cx="269" cy="114" r="4.5" fill="#00a1b0"/>
  <!-- visor -->
  <rect x="152" y="98" width="96" height="30" rx="12" fill="#050707" stroke="#1d2224" stroke-width="3"/>
  <rect x="160" y="105" width="80" height="16" rx="8" fill="url(#visor)"/>
  <rect x="166" y="108" width="26" height="8" rx="4" fill="#eafdff" opacity=".85"/>
</svg>
